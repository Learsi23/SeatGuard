services:
  db:
    image: postgres:18-alpine
    container_name: seatguard-db
    environment:
      POSTGRES_DB: seatguard
      POSTGRES_USER: seatguard
      # Read from the .env file next to this file (never committed).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # 127.0.0.1 only: the database is not reachable from other machines on the network.
      - "127.0.0.1:5439:5432"
    volumes:
      - seatguard-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatguard -d seatguard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  seatguard-db:
